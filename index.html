<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow — A smart, accessible to-do list application for organizing daily tasks and tracking productivity.">
  <title>TaskFlow — Smart To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/three-background.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="app-brand">
        <span class="app-logo-mark" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="28" height="28" rx="8" fill="url(#logo-grad)"/>
            <path d="M8 14.5L12 18.5L20 10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                <stop stop-color="#3B82C4"/>
                <stop offset="1" stop-color="#244D83"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <h1 class="app-title">TaskFlow</h1>
      </div>
      <p class="app-subtitle">Stay focused, organized, and achieve more every day.</p>
    </header>

    <!-- Main Task Management Section -->
    <main class="app-main" id="main-content">
      <!-- Storage Status / Warning Alert -->
      <aside id="storage-alert" class="storage-alert" role="alert" aria-live="polite" hidden></aside>

      <section class="task-management-section" aria-labelledby="task-management-heading">
        <h2 id="task-management-heading" class="section-heading">Manage Your Tasks</h2>

        <!-- Task Creation Form -->
        <form id="task-form" class="task-form" novalidate>
          <div class="form-group">
            <label for="task-input" class="form-label">Task Title</label>
            <div class="input-action-group">
              <input 
                type="text" 
                id="task-input" 
                name="taskTitle" 
                class="task-input" 
                placeholder="What needs to be done?" 
                autocomplete="off" 
                required 
                aria-required="true"
                aria-describedby="input-error"
              >
              <button type="submit" id="add-task-btn" class="btn btn-primary">
                Add Task
              </button>
            </div>
            <p id="input-error" class="error-message" role="alert" aria-live="polite" hidden></p>
          </div>
        </form>
      </section>

      <!-- Task Statistics -->
      <section class="task-stats-section" aria-label="Task statistics">
        <ul class="stats-list" aria-label="Task counts">
          <li class="stat-item stat-item-total">
            <div class="stat-meta">
              <span class="stat-icon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 6h11M9 12h11M9 18h11M4 6h1v.01M4 12h1v.01M4 18h1v.01"/>
                </svg>
              </span>
              <span class="stat-label">Total</span>
            </div>
            <strong id="total-tasks-count" class="stat-value">0</strong>
          </li>
          <li class="stat-item stat-item-active">
            <div class="stat-meta">
              <span class="stat-icon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9"/>
                  <polyline points="12 7 12 12 15 15"/>
                </svg>
              </span>
              <span class="stat-label">Active</span>
            </div>
            <strong id="active-tasks-count" class="stat-value">0</strong>
          </li>
          <li class="stat-item stat-item-completed">
            <div class="stat-meta">
              <span class="stat-icon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                  <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
              </span>
              <span class="stat-label">Done</span>
            </div>
            <strong id="completed-tasks-count" class="stat-value">0</strong>
          </li>
        </ul>
      </section>

      <!-- Filter Controls -->
      <section class="task-filter-section" aria-label="Task filters">
        <div class="filter-group" role="group" aria-label="Filter tasks by status">
          <button 
            type="button" 
            class="filter-btn active" 
            data-filter="all" 
            aria-pressed="true"
          >
            All
          </button>
          <button 
            type="button" 
            class="filter-btn" 
            data-filter="active" 
            aria-pressed="false"
          >
            Active
          </button>
          <button 
            type="button" 
            class="filter-btn" 
            data-filter="completed" 
            aria-pressed="false"
          >
            Completed
          </button>
        </div>
      </section>

      <!-- Task List Container -->
      <section class="task-list-section" aria-label="Tasks list">
        <ul id="task-list" class="task-list" aria-label="Task list">
          <!-- Dynamically generated task items will be rendered here -->
        </ul>
        <div id="empty-state" class="empty-state">
          <div class="empty-state-icon" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <path d="M9 15l2 2 4-4"></path>
            </svg>
          </div>
          <p class="empty-state-message">No tasks found. Add a task above to get started!</p>
        </div>
        <!-- Accessible live region for dynamic status announcements -->
        <div id="status-announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p class="app-description">TaskFlow — A client-side to-do list application engineered for seamless productivity and focus.</p>
    </footer>
  </div>

  <!-- 3D Productivity Workspace Background -->
  <div id="three-bg-container" class="three-bg-container" aria-hidden="true"></div>
  <script src="js/vendor/three.min.js" defer></script>
  <script src="js/three-background.js" defer></script>
</body>
</html>
